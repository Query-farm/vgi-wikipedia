# Private graders for `vgi-lint simulate` (VGI416). The worker publishes only
# task names and prompts in vgi.agent_test_tasks; these canonical solutions and
# grading options stay in the repo and are merged by task name.
tasks:
  - name: page_summary_title
    reference_sql: "SELECT title FROM wiki.main.wiki_page_summary('DuckDB')"
    ignore_column_names: true
    unordered: true
  - name: missing_page_is_null
    reference_sql: "SELECT wiki.main.wiki_page('ThisPageDoesNotExist_zzz') IS NULL AS missing"
    ignore_column_names: true
    unordered: true
  - name: search_found
    reference_sql: "SELECT count(*) >= 1 AS found FROM wiki.main.wiki_search('apache arrow', count := 3)"
    ignore_column_names: true
    unordered: true
  - name: page_has_extract
    reference_sql: "SELECT wiki.main.wiki_page('DuckDB') IS NOT NULL AS has_extract"
    ignore_column_names: true
    unordered: true
  - name: article_wikidata_id
    reference_sql: "SELECT entity_id FROM wiki.main.wiki_entity('Douglas Adams')"
    ignore_column_names: true
    unordered: true
  - name: wikidata_label
    reference_sql: "SELECT label FROM wiki.wikidata.entity(['Q42'])"
    ignore_column_names: true
    unordered: true
  - name: wikidata_birth
    reference_sql: "SELECT value.time FROM wiki.wikidata.statements(['Q42'], property_id := 'P569')"
    ignore_column_names: true
    unordered: true
  - name: wikidata_qualifiers
    reference_sql: "SELECT DISTINCT property_id FROM wiki.wikidata.qualifiers(['Q42'], property_id := 'P26') ORDER BY property_id"
    ignore_column_names: true
    unordered: true
  - name: wikidata_sources
    reference_sql: "SELECT count(*) > 0 FROM wiki.wikidata.statement_references(['Q42'], property_id := 'P31')"
    ignore_column_names: true
    unordered: true
  - name: wikidata_discovery
    reference_sql: "SELECT count(*) > 0 FROM wiki.wikidata.search('Douglas Adams', count := 3)"
    ignore_column_names: true
    unordered: true
  - name: wikidata_graph
    reference_sql: "SELECT answer FROM wiki.wikidata.sparql('ASK { <http://www.wikidata.org/entity/Q42> ?p ?o }')"
    ignore_column_names: true
    unordered: true
  - name: article_birth_date
    reference_sql: "SELECT s.value.time FROM wiki.main.wiki_entity('Ada Lovelace') AS e JOIN wiki.wikidata.statements(['Q7259'], property_id := 'P569') AS s USING (entity_id)"
    ignore_column_names: true
    unordered: true
  - name: spouse_label_and_start
    reference_sql: "SELECT p.label, q.value.time FROM wiki.wikidata.statements(['Q42'], property_id := 'P26') AS s JOIN wiki.wikidata.qualifiers(['Q42'], property_id := 'P26') AS q USING (source_api, entity_revision, requested_id, statement_id) JOIN wiki.wikidata.entity(['Q14623681']) AS p ON p.entity_id = s.value.entity_id WHERE q.property_id = 'P580'"
    ignore_column_names: true
    unordered: true
