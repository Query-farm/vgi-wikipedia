# Copyright 2026 Query Farm LLC - https://query.farm
#
# Unit tests (pytest), lint, and the sqllogictest extension suite
# (test/sql/*.test) run against the vgi-wikipedia worker through the real signed
# `vgi` DuckDB community extension via a prebuilt standalone `haybarn-unittest`.
# The SQL E2E points the worker at a local mock MediaWiki server — no keys, no
# cost, no live egress. See ci/README.md for the design.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The SQL test runner, pinned; its haybarn 2.0 community `vgi` extension speaks
  # the worker's VGI protocol (vgi.v3).
  HAYBARN_VERSION: "2.0.1rc3"

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      # The `live` marker (real Wikipedia over the network) is excluded.
      - name: Run tests
        run: uv run --no-sync pytest -q -m "not live"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Check linting
        run: uv run --no-sync ruff check .

      - name: Type check (mypy)
        run: uv run --no-sync mypy vgi_wikipedia/ wikipedia_worker.py serve.py

      - name: Docstring lint (pydoclint)
        run: uvx pydoclint==0.12.0 --config pyproject.toml vgi_wikipedia/ wikipedia_worker.py serve.py

  # Catalog/metadata quality gate: build the worker, then run vgi-lint against it
  # against local API fixtures using the signed vgi extension. Fails
  # the build on any finding at info or above. Kept a separate job for visibility.
  metadata-quality:
    name: Metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install the worker (from the lockfile, with the http extra)
        run: uv sync --frozen --python 3.14 --extra http

      - name: vgi-lint (local API fixtures, strict info threshold)
        run: uv run --no-sync python scripts/check_metadata.py

  # test/sql/*.test through DuckDB (the haybarn-unittest runner + the signed
  # community `vgi` extension) over every transport, via ci/run-integration.sh —
  # the same script `make test-sql` runs.
  integration:
    name: SQL E2E (${{ matrix.transport }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # launch: DuckDB starts the worker once on an AF_UNIX socket and pools it.
        transport: [stdio, launch, http]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14"
      - name: Build the worker
        run: uv sync --locked --all-extras
      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"
      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          # ci/run-integration.sh starts the mock MediaWiki/Wikidata server
          # (tests/mock_server.py) for every transport: no keys, no live egress.
          export WORKER="$PWD/.venv/bin/vgi-wikipedia-worker"
          export HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest"
          TRANSPORT=${{ matrix.transport }} ci/run-integration.sh
